name: CI

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  test:
    # Run the minimal matrix for automatic non-main events.
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: [ '3.12' ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Resolve API base URL
        id: resolve-api-base-url
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.PROPAGATE_TOKEN || github.token }}
          script: |
            const fallbackUrl = 'https://api-staging.pdfdancer.com';
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('base_url', fallbackUrl);
              return;
            }

            const body = pr.body || '';
            const apiPrMatch = body.match(/## Source API PR[\s\S]*?^\s+- Repository:\s*MenschMachine\/pdfdancer-api\s*$[\s\S]*?^\s+- PR:\s*#?(\d+)\s*$/im);
            if (!apiPrMatch) {
              core.info('No Source API PR block found in the PR body; using staging API.');
              core.setOutput('base_url', fallbackUrl);
              return;
            }

            const apiPrNumber = Number(apiPrMatch[1]);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: 'MenschMachine',
              repo: 'pdfdancer-api',
              issue_number: apiPrNumber,
              per_page: 100,
            });
            const previewComments = comments.filter((comment) =>
              typeof comment.body === 'string' && comment.body.includes('### Preview Environment')
            );
            if (previewComments.length === 0) {
              core.setFailed(`Source API PR #${apiPrNumber} is referenced by this PR, but no preview comment was found.`);
              return;
            }

            const previewComment = previewComments[previewComments.length - 1];
            const urlMatch = previewComment.body.match(/\*\*API URL:\*\*\s*(https?:\/\/\S+)/);
            if (!urlMatch) {
              core.setFailed(`Preview comment on source API PR #${apiPrNumber} does not contain a parseable API URL.`);
              return;
            }

            core.info(`Using preview API URL from source API PR #${apiPrNumber}: ${urlMatch[1]}`);
            core.setOutput('base_url', urlMatch[1]);

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv venv

      - name: Install dependencies
        run: |
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -e ".[dev]"

      - name: Run linter
        run: |
          venv/bin/python -m flake8 src/

      - name: Run tests
        run: |
          mkdir -p test-results
          venv/bin/python -m pytest tests/ -v --maxfail=3 --junitxml=test-results/junit.xml
        env:
          PDFDANCER_BASE_URL: ${{ steps.resolve-api-base-url.outputs.base_url }}
          PDFDANCER_API_TOKEN: 42

      - name: Build distribution packages
        run: venv/bin/python -m build

      - name: Validate packages
        run: venv/bin/python -m twine check dist/*

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: |
            test-results/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7


  test-full-matrix:
    # Run the full matrix on main and for every manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ '3.10', '3.11', '3.12', '3.13' ]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment (Unix)
        if: runner.os != 'Windows'
        run: python -m venv venv

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -e ".[dev]"

      - name: Run linter (Unix)
        if: runner.os != 'Windows'
        run: |
          venv/bin/python -m flake8 src/

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p test-results
          venv/bin/python -m pytest tests/ -v --maxfail=3 --junitxml=test-results/junit.xml
        env:
          PDFDANCER_BASE_URL: https://api-staging.pdfdancer.com
          PDFDANCER_API_TOKEN: 42

      - name: Build & Validate (Unix)
        if: runner.os != 'Windows'
        run: |
          venv/bin/python -m build
          venv/bin/python -m twine check dist/*

      - name: Create virtual environment (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m venv venv

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          venv\Scripts\pip install --upgrade pip
          venv\Scripts\pip install -e ".[dev]"

      - name: Run linter (Windows)
        if: runner.os == 'Windows'
        run: |
          venv\Scripts\python -m flake8 src/

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist test-results mkdir test-results
          venv\Scripts\python -m pytest tests/ -v --maxfail=3 --junitxml=test-results/junit.xml
        env:
          PDFDANCER_BASE_URL: https://api-staging.pdfdancer.com
          PDFDANCER_API_TOKEN: 42

      - name: Build & Validate (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          venv\Scripts\python -m build
          venv\Scripts\python -m twine check dist/*

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: |
            test-results/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
